<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-label="The six delegation patterns P1 to P6">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <text x="40" y="36" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">The Six Patterns</text>
  <text x="40" y="56" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">P1–P5 route work across models · P6 routes work across processes</text>

  <!-- P1 -->
  <g>
    <rect x="40" y="72" width="356" height="164" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <rect x="16" y="88" width="38" height="24" rx="6" fill="url(#accent)" transform="translate(24,0)"/>
    <text x="62" y="105" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#0b1020">P1</text>
    <text x="112" y="105" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Router</text>
    <text x="64" y="140" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb0c3">Classify each request, send it to exactly one</text>
    <text x="64" y="158" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb0c3">model. Holds a quality floor at lower spend.</text>
    <text x="64" y="186" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#22d3ee">cost is binding · needs calibration data</text>
  </g>

  <!-- P2 -->
  <g>
    <rect x="404" y="72" width="356" height="164" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <rect x="428" y="88" width="38" height="24" rx="6" fill="url(#accent)"/>
    <text x="437" y="105" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#0b1020">P2</text>
    <text x="476" y="105" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Cascade</text>
    <text x="428" y="140" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb0c3">Cheap first, verify, escalate on fail. The only</text>
    <text x="428" y="158" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb0c3">pattern that beats frontier on cost AND quality.</text>
    <text x="428" y="186" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#22d3ee">needs a verifier + eval gate</text>
  </g>

  <!-- P3 -->
  <g>
    <rect x="40" y="252" width="356" height="164" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <rect x="64" y="268" width="38" height="24" rx="6" fill="url(#accent)"/>
    <text x="73" y="285" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#0b1020">P3</text>
    <text x="112" y="285" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Orchestrator-Worker</text>
    <text x="64" y="320" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb0c3">Frontier plans, cheap workers execute in</text>
    <text x="64" y="338" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb0c3">parallel. +90.2% quality at ~15x the tokens.</text>
    <text x="64" y="366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#f87171">NOT a cost pattern · cap fan-out</text>
  </g>

  <!-- P4 -->
  <g>
    <rect x="404" y="252" width="356" height="164" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <rect x="428" y="268" width="38" height="24" rx="6" fill="url(#accent)"/>
    <text x="437" y="285" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#0b1020">P4</text>
    <text x="476" y="285" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Advisor ("smart friend")</text>
    <text x="428" y="320" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb0c3">Cheap primary leads, escalates up on demand.</text>
    <text x="428" y="338" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb0c3">Weak primaries cannot know their own limits.</text>
    <text x="428" y="366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#f87171">only when both models are frontier</text>
  </g>

  <!-- P5 -->
  <g>
    <rect x="40" y="432" width="356" height="164" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <rect x="64" y="448" width="38" height="24" rx="6" fill="url(#accent)"/>
    <text x="73" y="465" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#0b1020">P5</text>
    <text x="112" y="465" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Plan-Then-Execute</text>
    <text x="64" y="500" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb0c3">Frontier freezes a spec, a persistent cheap worker</text>
    <text x="64" y="518" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb0c3">executes it. Revisions hit cached context (~10%).</text>
    <text x="64" y="546" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#22d3ee">best cost/quality for coding</text>
  </g>

  <!-- P6 -->
  <g>
    <rect x="404" y="432" width="356" height="164" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <rect x="428" y="448" width="38" height="24" rx="6" fill="url(#accent)"/>
    <text x="437" y="465" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#0b1020">P6</text>
    <text x="476" y="465" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Cross-CLI Relay</text>
    <text x="428" y="500" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb0c3">A separate coding-agent CLI executes a self-</text>
    <text x="428" y="518" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9fb0c3">contained brief. You review the diff, you commit.</text>
    <text x="428" y="546" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#22d3ee">relay never commits · touchedFiles is not containment</text>
  </g>

  <text x="40" y="624" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">Numbers: Anthropic internal research eval (+90.2%, ~15x) — directional anchors, not guarantees.</text>
</svg>
