    <rect x="303" y="186" width="137" height="26" rx="13" fill="none" stroke="#6366f1" stroke-opacity="0.7"/>
    <text x="321" y="203" fill="#e2e8f0">8-question gate</text>
    <rect x="454" y="186" width="145" height="26" rx="13" fill="none" stroke="#6366f1" stroke-opacity="0.7"/>
    <text x="472" y="203" fill="#e2e8f0">14 anti-patterns</text>
