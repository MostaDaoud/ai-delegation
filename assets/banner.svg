<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-label="ai-delegation skill pack banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#131f38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="240" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="4" rx="2" fill="url(#accent)"/>

  <!-- orchestrator-worker motif -->
  <g stroke="#38bdf8" stroke-opacity="0.35" fill="none" stroke-width="1.5">
    <line x1="688" y1="86" x2="622" y2="150"/>
    <line x1="688" y1="86" x2="684" y2="168"/>
    <line x1="688" y1="86" x2="748" y2="148"/>
    <line x1="688" y1="86" x2="740" y2="66"/>
    <line x1="688" y1="86" x2="636" y2="52"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.55">
    <circle cx="622" cy="150" r="7"/>
    <circle cx="684" cy="168" r="7"/>
    <circle cx="748" cy="148" r="7"/>
    <circle cx="740" cy="66" r="7"/>
    <circle cx="636" cy="52" r="7"/>
  </g>
  <circle cx="688" cy="86" r="13" fill="#6366f1" fill-opacity="0.9"/>
  <circle cx="688" cy="86" r="19" fill="none" stroke="#6366f1" stroke-opacity="0.4"/>

  <text x="48" y="46" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="13" fill="#22d3ee" letter-spacing="2">SKILL PACK · v1.1</text>

  <text x="48" y="106" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="44" font-weight="700" fill="#f8fafc">ai-delegation</text>
  <text x="48" y="140" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">Decide · Wire · Cost · Audit</text>
  <text x="48" y="163" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">when to delegate, which model tier, and when the answer is "don't"</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
    <rect x="48" y="186" width="98" height="26" rx="13" fill="none" stroke="#6366f1" stroke-opacity="0.7"/>
    <text x="66" y="203" fill="#e2e8f0">6 patterns</text>
    <rect x="160" y="186" width="129" height="26" rx="13" fill="none" stroke="#6366f1" stroke-opacity="0.7"/>
